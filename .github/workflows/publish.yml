name: Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publishing steps (build only)"
        type: boolean
        default: true

# Add this to force GitHub actions to use Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build extension zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create extension zip
        run: zip -r extension.zip * -x "*.git*" -x ".github/*" -x "images/screenshots/*" -x "*.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run != true }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run != true }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: extension-dir

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Upgraded to 24 to stay current

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Sign and submit to AMO
        run: |
          cd extension-dir
          unzip extension.zip
          web-ext sign \
            --api-key=${{ secrets.FIREFOX_API_KEY }} \
            --api-secret=${{ secrets.FIREFOX_API_SECRET }} \
            --source-dir=. \
            --channel=listed
